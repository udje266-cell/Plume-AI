name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - name: worker/index.js est à jour avec src/
        run: git diff --exit-code worker/index.js || (echo "Lance npm run bundle et committe worker/index.js" && exit 1)
      - run: npm run build && npm run validate
